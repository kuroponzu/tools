<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>作業タイマー | Dev Tools</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <div class="panel">
        <div class="presets">
          <button data-minutes="15">15分</button>
          <button data-minutes="25">25分</button>
          <button data-minutes="50">50分</button>
          <button data-minutes="60">60分</button>
        </div>
        <div class="minutes-input">
          <label for="minutes">分数:</label>
          <input id="minutes" type="number" min="1" max="600" value="60" />
        </div>
        <div id="display" class="timer-display">60:00</div>
        <div class="controls">
          <button id="start" class="primary">開始</button>
          <button id="pause" disabled>一時停止</button>
          <button id="reset" disabled>リセット</button>
        </div>
        <div id="status" class="status"></div>
      </div>
    </main>
    <script src="/sidebar.js"></script>
    <script src="/timer/timer.js"></script>
  </body>
</html>
